name: Deploy to Aliyun

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SHOW_DEMO_ACCOUNT: "false"
        run: |
          npm ci --no-audit --no-fund
          npm run build
          tar -czf ../fe-dist.tar.gz -C dist .

      # Windows 粘贴私钥容易丢换行，导致 appleboy 报「未找到密钥」。
      # Secret SSH_PRIVATE_KEY 请改成私钥文件的 Base64（一行），这里再解码。
      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n ' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload frontend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          set -e
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            fe-dist.tar.gz \
            "${SSH_USER}@${SSH_HOST}:/tmp/fe-dist.tar.gz"

      - name: Remote deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            "${SSH_USER}@${SSH_HOST}" bash -s <<'EOF'
          set -e
          HTML=/opt/enterprise-ai/deploy/html
          mkdir -p "$HTML"
          tar -xzf /tmp/fe-dist.tar.gz -C "$HTML"
          rm -f /tmp/fe-dist.tar.gz

          if [ -x /opt/enterprise-ai/deploy/deploy.sh ]; then
            /opt/enterprise-ai/deploy/deploy.sh
          else
            echo "deploy.sh 不存在或不可执行"
            exit 1
          fi

          curl -fsS http://127.0.0.1/api/v1/health
          echo "deploy ok"
          EOF
