name: enterprise-ai

# 生产部署：Nginx(前端静态资源 + API 反向代理) + FastAPI + Celery + MySQL + Redis + MinIO + Milvus
# 用法：
#   cd deploy
#   cp .env.example .env   # 修改 SECRET_KEY / 数据库密码等
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: enterprise_ai
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      - ../backend/sql/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 生产环境不要映射 3306 到公网
    expose:
      - "3306"

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    expose:
      - "6379"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "9000"

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    restart: always
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://127.0.0.1:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd-data:/etcd

  milvus:
    image: milvusdb/milvus:v2.4.15
    restart: always
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy
    expose:
      - "19530"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_ENV: prod
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: mysql+asyncmy://root:${MYSQL_ROOT_PASSWORD:-change-me}@mysql:3306/enterprise_ai?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      FIRST_ORG_CODE: ${FIRST_ORG_CODE:-demo}
      FIRST_SUPERUSER_USERNAME: ${FIRST_SUPERUSER_USERNAME:-admin}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-Admin@123456}
      # ---- AI 模型网关（企业未配模型时用这里的平台级兜底）----
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-bailian}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-qwen-plus}
      AI_CLOUD_BASE_URL: ${AI_CLOUD_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AI_CLOUD_API_KEY: ${AI_CLOUD_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-v3}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2048}
      AI_KEY_ENCRYPTION_KEY: ${AI_KEY_ENCRYPTION_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             python -m app.db.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    expose:
      - "8000"

  celery-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_ENV: prod
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: mysql+asyncmy://root:${MYSQL_ROOT_PASSWORD:-change-me}@mysql:3306/enterprise_ai?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-l", "info", "--concurrency=2"]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
  minio-data:
  etcd-data:
  milvus-data:
