version: '1.0'
name: main-deploy
displayName: 主干发布（前端云端构建 → 阿里云部署）

triggers:
  push:
    branches:
      precise:
        - main

stages:
  - stage:
      name: build
      displayName: 构建
      strategy: naturally
      trigger: auto
      steps:
        - step: build@nodejs
          name: build_frontend
          displayName: 前端构建（Node + Vite）
          nodeVersion: 22.14.0
          commands:
            - node -v && npm -v
            - npm config set registry https://registry.npmmirror.com
            - cd frontend && npm ci --no-audit --no-fund && VITE_SHOW_DEMO_ACCOUNT=false npm run build
            - du -sh frontend/dist && ls frontend/dist
          artifacts:
            - name: BUILD_ARTIFACT
              path:
                - ./frontend/dist

  - stage:
      name: deploy
      displayName: 部署
      strategy: naturally
      trigger: auto
      steps:
        - step: deploy@agent
          name: deploy_frontend
          displayName: 发布到阿里云服务器
          hostGroupID: ea-aliyun
          deployArtifact:
            - source: build
              name: output
              target: ~/gitee_go/deploy
              dependArtifact: BUILD_ARTIFACT
          script: |
            set -e
            echo "执行用户: $(whoami)"
            echo "=== 1. 解包制品 ==="
            cd ~/gitee_go/deploy
            ls -lh
            rm -rf /tmp/ea-fe
            mkdir -p /tmp/ea-fe
            tar -zxf output.tar.gz -C /tmp/ea-fe
            INDEX=$(find /tmp/ea-fe -maxdepth 3 -name index.html | head -1)
            if [ -z "$INDEX" ]; then
              echo "!! 制品里没有 index.html，构建产物路径可能不对"
              exit 1
            fi
            SRC=$(dirname "$INDEX")
            echo "前端产物目录: $SRC"
            du -sh "$SRC"

            echo "=== 2. 覆盖 nginx 静态目录 ==="
            HTML=/opt/enterprise-ai/deploy/html
            mkdir -p "$HTML/assets"
            cp -a "$SRC/assets/." "$HTML/assets/"
            cp -f "$SRC/index.html" "$HTML/index.html.new"
            mv -f "$HTML/index.html.new" "$HTML/index.html"
            if [ -f "$SRC/favicon.svg" ]; then cp -f "$SRC/favicon.svg" "$HTML/"; fi
            find "$HTML/assets" -type f -mtime +7 -delete
            echo "线上入口: $(grep -o 'assets/index-[^"]*' "$HTML/index.html" | head -1)"

            echo "=== 3. 同步代码并重建后端 ==="
            cd /opt/enterprise-ai
            bash deploy/deploy.sh

            echo "=== 4. 校验 ==="
            curl -fsS -m 5 http://127.0.0.1/api/v1/health
            echo
            curl -s -o /dev/null -w 'SITE_HTTP=%{http_code}\n' http://127.0.0.1/