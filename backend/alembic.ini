[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# The real connection string is read from app.core.config.settings inside alembic/env.py.
# This value is only a placeholder required by Alembic.
sqlalchemy.url = mysql+asyncmy://root:root@127.0.0.1:3306/enterprise_ai?charset=utf8mb4

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
